databases:
  - name: dropshop-db
    plan: free          # free tier: 256 MB RAM, 1 GB storage, 90-day expiry — upgrade to starter ($7/mo) for production
    region: oregon

services:
  - type: web
    name: dropshop-store
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn store.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dropshop-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: STORE_NAME
        value: MyDropShop              # change to your store name
      - key: STORE_URL
        sync: false                    # set to your public URL after deploy, e.g. https://dropshop-store.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_API_KEY
        sync: false                    # sk_test_... while testing, sk_live_... for real payments
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false                    # pk_test_... while testing, pk_live_... for real payments
      - key: STRIPE_WEBHOOK_SECRET
        sync: false                    # whsec_... from Stripe → Developers → Webhooks
      - key: CJDROPSHIPPING_API_KEY
        sync: false
      - key: CJDROPSHIPPING_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        sync: false

  - type: worker
    name: dropshop-agents
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python orchestrator.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dropshop-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CJDROPSHIPPING_API_KEY
        sync: false
      - key: CJDROPSHIPPING_EMAIL
        sync: false
      - key: SERP_API_KEY
        sync: false
