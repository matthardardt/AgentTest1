services:
  - type: web
    name: dropshop-store
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn store.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CJDROPSHIPPING_API_KEY
        sync: false
      - key: CJDROPSHIPPING_EMAIL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: STORE_URL
        value: https://vendosdeals.com
      - key: ALLOW_MOCK_SUPPLIERS
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////var/data/dropshipping.db
    disk:
      name: dropdata
      mountPath: /var/data
      sizeGB: 1

  - type: worker
    name: dropshop-agents
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python orchestrator.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CJDROPSHIPPING_API_KEY
        sync: false
      - key: CJDROPSHIPPING_EMAIL
        sync: false
      - key: SERP_API_KEY
        sync: false
      - key: ALLOW_MOCK_SUPPLIERS
        value: "false"
      - key: STORE_URL
        value: https://vendosdeals.com
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////var/data/dropshipping.db
    disk:
      name: dropdata
      mountPath: /var/data
      sizeGB: 1
