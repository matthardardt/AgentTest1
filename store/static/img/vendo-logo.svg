<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90">
  <defs>
    <linearGradient id="b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="f" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="15%" y2="100%">
      <stop offset="0%"   stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <radialGradient id="e" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </radialGradient>
    <filter id="s" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4"
                    flood-color="#1E1B4B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ─── Mini Vendo Icon (70×86, left-padded 4px) ─── -->
  <g transform="translate(4,2)">
    <!-- Machine body -->
    <rect x="5" y="8" width="62" height="72" rx="11" fill="url(#b)" filter="url(#s)"/>
    <!-- Shine -->
    <rect x="9" y="16" width="5" height="56" rx="2.5" fill="white" opacity="0.16"/>

    <!-- Antenna -->
    <line x1="36" y1="8" x2="36" y2="2" stroke="#6D28D9" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="36" cy="2" r="5.5" fill="#A78BFA"/>
    <circle cx="36" cy="2" r="3"   fill="#7C3AED"/>
    <circle cx="34" cy="1" r="1.5" fill="white" opacity="0.7"/>

    <!-- Face panel -->
    <rect x="10" y="14" width="52" height="32" rx="7" fill="url(#f)"/>
    <rect x="10" y="14" width="52" height="32" rx="7" fill="none"
          stroke="#6D28D9" stroke-width="1" opacity="0.6"/>

    <!-- Left eye -->
    <ellipse cx="25" cy="29" rx="8.5" ry="9.5" fill="white"/>
    <ellipse cx="25" cy="31" rx="6.5" ry="7.5" fill="url(#e)"/>
    <ellipse cx="25" cy="32" rx="3.5" ry="4"   fill="#1E1B4B"/>
    <circle  cx="28" cy="27" r="2.8" fill="white"/>
    <circle  cx="22" cy="35" r="1.2" fill="white" opacity="0.38"/>

    <!-- Right eye -->
    <ellipse cx="47" cy="29" rx="8.5" ry="9.5" fill="white"/>
    <ellipse cx="47" cy="31" rx="6.5" ry="7.5" fill="url(#e)"/>
    <ellipse cx="47" cy="32" rx="3.5" ry="4"   fill="#1E1B4B"/>
    <circle  cx="50" cy="27" r="2.8" fill="white"/>
    <circle  cx="44" cy="35" r="1.2" fill="white" opacity="0.38"/>

    <!-- Cheeks -->
    <ellipse cx="15" cy="40" rx="6.5" ry="4" fill="#FB7185" opacity="0.5"/>
    <ellipse cx="57" cy="40" rx="6.5" ry="4" fill="#FB7185" opacity="0.5"/>

    <!-- Smile -->
    <path d="M 27 43 Q 36 50 45 43"
          stroke="#FB7185" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Brand micro-strip -->
    <rect x="5" y="48" width="62" height="8" fill="#1E1065" opacity="0.8"/>
    <text x="36" y="55" font-family="Arial,sans-serif" font-size="4.5"
          font-weight="bold" fill="#C4B5FD" text-anchor="middle" letter-spacing="1">
      VENDO&#x2019;S DEALS
    </text>

    <!-- Glass panel -->
    <rect x="10" y="58" width="52" height="18" rx="5" fill="url(#g)"/>
    <rect x="10" y="58" width="52" height="18" rx="5" fill="none" stroke="#93C5FD" stroke-width="1"/>
    <!-- Items: star (yellow), burger (orange), bolt (yellow), gem (cyan) -->
    <circle cx="20" cy="67" r="5" fill="#FBBF24" opacity="0.9"/>
    <circle cx="36" cy="67" r="5" fill="#F97316" opacity="0.9"/>
    <circle cx="52" cy="67" r="5" fill="#67E8F9" opacity="0.9"/>

    <!-- Feet (small) -->
    <rect x="13" y="77" width="16" height="7" rx="4" fill="#4C1D95"/>
    <rect x="43" y="77" width="16" height="7" rx="4" fill="#4C1D95"/>
  </g>

  <!-- ─── Brand Text ─── -->
  <!-- Store name -->
  <text x="90" y="46"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="30" font-weight="800" fill="#4C1D95"
        dominant-baseline="middle">Vendo&#x2019;s Deals</text>
  <!-- Tagline -->
  <text x="92" y="68"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="12" font-weight="400" fill="#7C3AED" letter-spacing="0.5">
    Your deals, delivered.
  </text>
</svg>
