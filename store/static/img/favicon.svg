<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="f" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <radialGradient id="e" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </radialGradient>
  </defs>

  <!-- Machine body -->
  <rect x="6" y="10" width="52" height="54" rx="11" fill="url(#b)"/>
  <!-- Shine -->
  <rect x="10" y="18" width="5" height="42" rx="2.5" fill="white" opacity="0.18"/>

  <!-- Antenna -->
  <line x1="32" y1="10" x2="32" y2="3" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="3" r="6"   fill="#A78BFA"/>
  <circle cx="32" cy="3" r="3.5" fill="#7C3AED"/>
  <circle cx="30" cy="1" r="1.8" fill="white" opacity="0.72"/>

  <!-- Face panel -->
  <rect x="11" y="16" width="42" height="28" rx="7" fill="url(#f)"/>

  <!-- Left eye -->
  <ellipse cx="22" cy="29" rx="7.5" ry="8.5" fill="white"/>
  <ellipse cx="22" cy="31" rx="5.5" ry="6.5" fill="url(#e)"/>
  <ellipse cx="22" cy="32" rx="3"   ry="3.5" fill="#1E1B4B"/>
  <circle  cx="26" cy="27" r="2.5"  fill="white"/>

  <!-- Right eye -->
  <ellipse cx="42" cy="29" rx="7.5" ry="8.5" fill="white"/>
  <ellipse cx="42" cy="31" rx="5.5" ry="6.5" fill="url(#e)"/>
  <ellipse cx="42" cy="32" rx="3"   ry="3.5" fill="#1E1B4B"/>
  <circle  cx="46" cy="27" r="2.5"  fill="white"/>

  <!-- Cheeks -->
  <ellipse cx="13" cy="38" rx="5.5" ry="3.5" fill="#FB7185" opacity="0.5"/>
  <ellipse cx="51" cy="38" rx="5.5" ry="3.5" fill="#FB7185" opacity="0.5"/>

  <!-- Smile -->
  <path d="M 24 40 Q 32 48 40 40"
        stroke="#FB7185" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Glass panel -->
  <rect x="11" y="48" width="42" height="12" rx="5" fill="#BFDBFE" opacity="0.9"/>
  <circle cx="20" cy="54" r="3.5" fill="#FBBF24"/>
  <circle cx="32" cy="54" r="3.5" fill="#F87171"/>
  <circle cx="44" cy="54" r="3.5" fill="#67E8F9"/>
</svg>
