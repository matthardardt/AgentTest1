<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}{{ store_name }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .line-clamp-3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

<!-- Nav -->
<nav class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="/" class="text-2xl font-bold text-indigo-600">{{ store_name }}</a>
    <div class="flex items-center gap-6">
      <a href="/" class="text-gray-600 hover:text-indigo-600 text-sm font-medium">Shop</a>
      <button onclick="openCart()" class="relative text-gray-600 hover:text-indigo-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.5 6h13M7 13l-1-4"/>
        </svg>
        <span id="cart-badge"
              class="absolute -top-2 -right-2 bg-indigo-600 text-white text-xs w-5 h-5 rounded-full
                     flex items-center justify-center hidden">0</span>
      </button>
    </div>
  </div>
</nav>

<!-- Cart Drawer -->
<div id="cart-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden" onclick="closeCart()"></div>
<div id="cart-drawer"
     class="fixed right-0 top-0 h-full w-80 bg-white shadow-xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
  <div class="p-4 border-b flex justify-between items-center">
    <h2 class="text-lg font-semibold">Your Cart</h2>
    <button onclick="closeCart()" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
  </div>
  <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
  <div class="p-4 border-t">
    <div class="flex justify-between mb-4 font-semibold">
      <span>Total</span>
      <span id="cart-total">$0.00</span>
    </div>
    <a href="/checkout"
       class="block w-full bg-indigo-600 text-white text-center py-3 rounded-lg font-medium hover:bg-indigo-700">
      Checkout
    </a>
  </div>
</div>

{% block content %}{% endblock %}

<footer class="mt-16 bg-white border-t py-8 text-center text-sm text-gray-500">
  <div class="flex justify-center gap-4 mb-3 flex-wrap">
    <a href="/pages/privacy" class="hover:text-indigo-600">Privacy</a>
    <a href="/pages/terms" class="hover:text-indigo-600">Terms</a>
    <a href="/pages/refund" class="hover:text-indigo-600">Refund Policy</a>
    <a href="/pages/shipping" class="hover:text-indigo-600">Shipping</a>
  </div>
  © {{ store_name }} {{ 2025 }}. All rights reserved.
</footer>

<script>
let cart = JSON.parse(localStorage.getItem('cart') || '[]');

function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); }

function addToCart(id, name, price, image) {
  const idx = cart.findIndex(i => i.product_id === id);
  if (idx >= 0) { cart[idx].quantity++; }
  else { cart.push({product_id: id, name, price, image, quantity: 1}); }
  saveCart(); renderCart(); openCart();
}

function removeFromCart(id) {
  cart = cart.filter(i => i.product_id !== id);
  saveCart(); renderCart();
}

function renderCart() {
  const container = document.getElementById('cart-items');
  const badge = document.getElementById('cart-badge');
  const totalEl = document.getElementById('cart-total');
  const totalQty = cart.reduce((s, i) => s + i.quantity, 0);
  const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);

  badge.textContent = totalQty;
  badge.classList.toggle('hidden', totalQty === 0);
  totalEl.textContent = '$' + total.toFixed(2);

  container.innerHTML = cart.length === 0
    ? '<p class="text-gray-400 text-center mt-8">Your cart is empty</p>'
    : cart.map(i => `
      <div class="flex gap-3 items-start">
        ${i.image ? `<img src="${i.image}" class="w-16 h-16 object-cover rounded" alt="${i.name}"/>` : ''}
        <div class="flex-1 min-w-0">
          <p class="font-medium text-sm line-clamp-2">${i.name}</p>
          <p class="text-indigo-600 font-semibold text-sm">$${(i.price * i.quantity).toFixed(2)}</p>
          <p class="text-xs text-gray-500">Qty: ${i.quantity}</p>
        </div>
        <button onclick="removeFromCart('${i.product_id}')" class="text-gray-400 hover:text-red-500 text-lg">&times;</button>
      </div>
    `).join('');
}

function openCart()  { document.getElementById('cart-drawer').classList.remove('translate-x-full');
                        document.getElementById('cart-overlay').classList.remove('hidden'); }
function closeCart() { document.getElementById('cart-drawer').classList.add('translate-x-full');
                        document.getElementById('cart-overlay').classList.add('hidden'); }

renderCart();
</script>
</body>
</html>
